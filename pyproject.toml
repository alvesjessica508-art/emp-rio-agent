[project]
name = "emporio-agent"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música (desafio técnico AI Engineer)"
requires-python = ">=3.10"
dependencies = ["openai>=1.40", "pypdf>=4.0", "python-dotenv>=1.0"]

[project.scripts]
emporio-agent = "emporio_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
